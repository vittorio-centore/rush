[project]
name = "rush-ml-service"
version = "0.1.0"
description = "FastAPI recommendation service and offline training jobs for Rush."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "joblib>=1.4.0",
  "lightgbm>=4.6.0",
  "numpy>=2.2.0",
  "pandas>=2.3.0",
  "pydantic>=2.10.0",
  "redis>=5.2.0",
  "sentence-transformers>=3.4.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ml_service*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
